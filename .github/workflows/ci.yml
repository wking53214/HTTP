name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: CLI smoke test
        run: |
          echo '{"method":"GET","path":"/api/v1/data","headers":{},"body":""}' | http-grind grind -
          http-grind limitations
          http-grind bench --size 40 --repeats 1
